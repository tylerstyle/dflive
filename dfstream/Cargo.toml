[package]
name = "dfstream"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "dfstream/1: authenticated, encrypted streams from a running system to a dfnix receiver"

[dependencies]
anyhow = "1.0.104"
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
spake2 = "0.4.0"
